name: Feature request
description: Suggest a new capability or an improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? For large or open-ended ideas you're still figuring out, a
        [Discussion](https://github.com/tbcsec/flagpost/discussions) is often the better first
        step — we can shape the scope there before it becomes a tracked issue.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched [existing issues](https://github.com/tbcsec/flagpost/issues) and this isn't already requested.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The motivation — what are you (or an organiser) unable to do today?
      placeholder: As a judge running a competition, I can't ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
    validations:
      required: false
  - type: dropdown
    id: size
    attributes:
      label: Rough size
      description: Your gut feel — helps with triage, not binding.
      options:
        - Small (a tweak or a single new option)
        - Medium (a new screen / endpoint)
        - Large (a whole subsystem — likely a Discussion first)
        - Not sure
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement this.
          required: false
