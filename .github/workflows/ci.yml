name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job below sets `timeout-minutes`. Without one a job inherits GitHub's
# 6-hour default, so a hung step sits there for an afternoon instead of failing:
# an apt mirror stall once held "Install WeasyPrint system libraries" for ~58
# minutes, and a stuck job blocks the merge queue while looking merely slow.
# These are hang-catchers, not performance budgets — each is a generous multiple
# of the observed duration, so hitting one means something is wrong, not that the
# suite grew. Raise them deliberately if a job legitimately outgrows its limit.
jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # ~8 min typical after the argon2 test-cost reduction (was ~12). Contended
    # runners have stretched this 3-4x on unchanged code, so the cap is well
    # clear of a bad day but far short of six hours.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install WeasyPrint system libraries
        # So the post-event report PDF path (#134, ADR-0030) renders and its
        # otherwise-skipped tests actually execute here, matching the backend image.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            shared-mime-info fonts-dejavu-core
      - name: Run tests
        # The suite is SQLite-backed and self-configures its env (see conftest),
        # so it needs no services.
        run: pytest -q

  migrations:
    name: Migrations (real Postgres)
    runs-on: ubuntu-latest
    # ~1 min typical; the extra room absorbs waiting on the Postgres service.
    timeout-minutes: 15
    # The pytest suite builds the schema from Base.metadata, never running the
    # migrations, and SQLite silently accepts things Postgres rejects. So run the
    # migration chain against a real Postgres to catch Postgres-only bugs (e.g.
    # `SET boolcol = 1` — Postgres needs TRUE) before they ship.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flagpost
          POSTGRES_PASSWORD: flagpost
          POSTGRES_DB: flagpost_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagpost -d flagpost_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://flagpost:flagpost@localhost:5432/flagpost_ci
      JWT_SECRET: ci-migration-check-secret-000000000000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Apply the full migration chain on Postgres
        run: alembic upgrade head
      - name: Boot check — seed roles on Postgres (mirrors app startup)
        run: |
          python - <<'PY'
          import asyncio
          import models  # noqa: F401 — populate Base.metadata
          from db import SessionLocal
          from auth.seed import seed_system_roles

          async def main():
              async with SessionLocal() as session:
                  await seed_system_roles(session)
          asyncio.run(main())
          print("migrations + role seed OK on Postgres")
          PY

  frontend:
    name: Frontend (types, lint, unit, build)
    runs-on: ubuntu-latest
    # ~2 min typical for install + tsc + eslint + vitest + build.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  # Guards the failure mode that broke main after #41: two PRs that are each
  # green can still break main together, when one adds a lint rule and the
  # other adds a violation of it.
  #
  # GitHub *does* build the merge result for `pull_request` — but it computes
  # that merge ref when the PR is pushed and never recomputes it as the base
  # moves. #41's run therefore tested itself merged into a main that predated
  # #37's eslint upgrade, so the rule that would have caught it didn't exist
  # yet in that checkout.
  #
  # This job merges `origin/main` **as of the moment it runs**, so re-running
  # it answers "would this break main right now?" — unlike the jobs above,
  # whose answer is frozen at push time. Re-run it before merging (or push to
  # the branch) if main has moved since the last run.
  merge-result:
    name: Merge result vs. current main
    runs-on: ubuntu-latest
    # ~1 min typical (lint + build only, see below).
    timeout-minutes: 20
    # Only meaningful for PRs; on a push to main the merge result *is* main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the merge base can actually be found.
          fetch-depth: 0
      - name: Merge current main into this branch
        run: |
          git config user.name "ci"
          git config user.email "ci@flagpost.invalid"
          git fetch origin main
          echo "Merging origin/main ($(git rev-parse --short origin/main)) into the PR head."
          if ! git merge --no-edit origin/main; then
            echo "::error::This branch conflicts with current main — update it before merging."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Lint + build only: this job exists to catch cross-PR *tooling* drift
      # (a new rule meeting a new violation), which is what `npm run build`
      # surfaces. The full suites already ran on the branch above.
      - name: Lint the merge result
        working-directory: frontend
        run: npx eslint .
      - name: Build the merge result
        working-directory: frontend
        run: npm run build
