name: Build demo images

# Builds the backend + frontend images and pushes them to GHCR as
# ghcr.io/<owner>/flagpost-{backend,frontend}:demo, so the demo box can pull them
# (make the packages public once — see docs/DEMO_DEPLOY.md).
#
# The frontend bakes NEXT_PUBLIC_API_URL at build time, so it's built for the
# demo's public origin here (override via the "Run workflow" input if needed).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/demo-images.yml"
  workflow_dispatch:
    inputs:
      public_origin:
        description: "Browser-facing origin baked into the frontend image"
        default: "https://demo.flagpost.io"

concurrency:
  group: demo-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PUBLIC_ORIGIN: ${{ github.event.inputs.public_origin || 'https://demo.flagpost.io' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR with GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # GHCR image paths must be lowercase.
      - name: Resolve lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/flagpost-${{ matrix.name }}:demo
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/flagpost-${{ matrix.name }}:${{ github.sha }}
          # Only the frontend consumes NEXT_PUBLIC_API_URL (baked at build time).
          build-args: |
            ${{ matrix.name == 'frontend' && format('NEXT_PUBLIC_API_URL={0}', env.PUBLIC_ORIGIN) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
