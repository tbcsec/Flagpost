name: Build release images

# Version-tagged images for reproducible deploys: pushing a `v*` tag builds
# ghcr.io/<owner>/flagpost-{backend,frontend}:vX.Y.Z (+ :latest), pinned to
# that exact source.
#
# Unlike the demo images (demo-images.yml, which bake the demo's public origin
# into the frontend), the release frontend is built in **same-origin mode**
# (empty NEXT_PUBLIC_API_URL): every API call and WebSocket goes out relative
# and resolves against whatever origin serves the page. That's what makes one
# image work behind any single-origin proxy (the documented Caddy topology)
# instead of being hard-wired to one operator's domain — see
# frontend/src/lib/api.ts / ws.ts for the contract.
#
# workflow_dispatch exists to backfill an already-pushed tag: run it with the
# tag selected as the ref (e.g. `gh workflow run release-images.yml --ref v1.1.0`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # The version a *source* build reports lives in backend/config.py, and has to
  # be bumped by hand when tagging (#111). Forgetting it is otherwise silent —
  # every `git clone` deployment would report the previous release for months,
  # and nothing would fail. This makes it a red build instead, and gates the
  # images so a mismatched version can never ship.
  version-check:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: config.py default must match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          default=$(grep -oP 'app_version:\s*str\s*=\s*"\K[^"]+' backend/config.py)
          echo "tag=$tag  config.py default=$default"
          # The default carries a -src marker (it's a source tree based on that
          # release, not the release itself); compare the version part only.
          if [ "${default%-src}" != "$tag" ]; then
            echo "::error file=backend/config.py::app_version default is '$default' but the tag is '$GITHUB_REF_NAME'. Set it to '${tag}-src' and re-tag."
            exit 1
          fi
          case "$default" in
            *-src) ;;
            *) echo "::error file=backend/config.py::app_version default '$default' is missing the -src marker; source builds must stay distinguishable from release images."; exit 1 ;;
          esac

  build:
    runs-on: ubuntu-latest
    needs: version-check
    # Guard the dispatch path: only a tag ref may publish version-named images.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write # required to push to GHCR with GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # GHCR image paths must be lowercase.
      - name: Resolve lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/flagpost-${{ matrix.name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/flagpost-${{ matrix.name }}:latest
          # Same-origin mode for the release frontend (empty NEXT_PUBLIC_API_URL
          # overrides the Dockerfile's localhost default). APP_VERSION bakes the
          # tag into the backend so the running deployment knows its own version
          # (#111) — the tag already names the image, this makes it readable
          # from inside the container too.
          build-args: |
            ${{ matrix.name == 'frontend' && 'NEXT_PUBLIC_API_URL=' || format('APP_VERSION={0}', github.ref_name) }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
