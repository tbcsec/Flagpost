# Alembic configuration. The database URL is intentionally NOT set here —
# env.py reads it from the application settings (config.py) so there's one
# source of truth. Migration filenames follow the CLAUDE.md convention:
#   YYYY-MM-DD_<revid>_<desc>.py
[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
