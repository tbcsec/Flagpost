id: competitions
name: Competitions
version: 1.0.0
# Required-core (§11.3): registers through the module path like everything
# else, but carries no admin enable/disable toggle.
required_core: true
provides:
  routes: true
  # The activity-room fan-out (§4.1, issue #18) listens for the curated
  # ACTIVITY_EVENTS allowlist and pings the per-competition room.
  event_listeners: true
dependencies: []
