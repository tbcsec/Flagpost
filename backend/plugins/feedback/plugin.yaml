id: feedback
name: Feedback & Surveys
version: 1.0.0
# The second optional module (§11.3, ROADMAP #22): not required-core, so it
# carries the per-competition enable/disable toggle (competition_modules —
# default ON). Every route 404s when disabled for the competition. Post-
# competition surveys with a full editor; a submission emits feedback.submitted,
# which the automation engine can trigger on.
required_core: false
provides:
  routes: true
dependencies:
  - competitions
