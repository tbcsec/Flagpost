[pytest]
# Put the backend package root on sys.path so tests import `db`, `models`,
# `utils`, `auth`, etc. the same way the app does.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    competition_lifecycle: test drives the competition status lifecycle itself; opt out of the default-running fixture and see the real not_started default (#221)
