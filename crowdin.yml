# Crowdin ↔ GitHub sync configuration (ADR-0029; pipeline described in
# docs/TRANSLATIONS.md).
#
# Read by the Crowdin GitHub integration: it uploads the English source on
# every push to main, pre-translates new strings by machine, and opens PRs
# with reviewed translations as frontend/messages/<locale>.json. Translation
# files are generated artifacts — never hand-edit them (Crowdin overwrites);
# fix translations in Crowdin, English source strings in a normal code PR.
#
# The env keys below are only used by the optional `crowdin` CLI for local
# inspection; the GitHub integration authenticates as an app and ignores them.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

files:
  # %locale% yields BCP 47 style codes ("de", "pt-BR"), matching what
  # frontend/src/i18n/config.ts LOCALES expects.
  - source: /frontend/messages/en.json
    translation: /frontend/messages/%locale%.json
