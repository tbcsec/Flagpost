# Development stack for Flagpost — hot reload, source mounted, dev servers.
#
#   docker compose -f docker-compose.dev.yml up --build
#     frontend  -> http://localhost:3000   (next dev)
#     backend   -> http://localhost:8000/docs
#     RustFS console -> http://localhost:9001
#
# For a production stack, use the default `docker compose up` (docker-compose.yml).

name: flagpost

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flagpost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flagpost}
      POSTGRES_DB: ${POSTGRES_DB:-flagpost}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flagpost} -d ${POSTGRES_DB:-flagpost}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage. RustFS replaces the retired MinIO (ADR-0041);
  # pinned tag, mirrored at ghcr.io/rustfs/rustfs:1.0.1.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      # The image already defaults to serving /data on :9000; only the
      # credential pair and the console switches differ from it.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # Apply migrations (creates tables + seeds the built-in roles) before
    # serving, so a fresh `docker compose up` is immediately usable.
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --ws-max-size 2097152 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flagpost}:${POSTGRES_PASSWORD:-flagpost}@postgres:5432/${POSTGRES_DB:-flagpost}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: rustfs:9000
      # The backend reaches the object store at rustfs:9000 inside the network, but signed
      # download URLs must point at a host the browser can reach (§13.3).
      S3_PUBLIC_ENDPOINT: localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      CORS_ORIGINS: http://localhost:3000
      # Pass JWT_SECRET through when set; when unset the app derives + persists a
      # strong per-install secret rather than run on a public default
      # (config._resolve_jwt_secret). Set it explicitly in prod / multi-host so
      # every replica shares one (ARCHITECTURE.md §7.7).
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # hot reload of source
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev
    environment:
      # Consumed in the browser, so it must resolve from the host, not the
      # compose network — hence localhost, not the `backend` service name.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Consumed by the Next SERVER (cold-start branding fetch, #362) — the
      # opposite: it must resolve from inside the compose network.
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules       # keep the image's installed deps
    depends_on:
      - backend

volumes:
  postgres-data:
  rustfs-data:
