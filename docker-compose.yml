# Production stack for Flagpost — the default `docker compose up`.
#
#   docker compose up --build        →  http://localhost:8080
#
# Caddy fronts both app services on a single origin, so the browser makes
# same-origin API + WebSocket calls with no CORS to configure. The defaults
# below work as-is for a local run; for a real deployment set at least:
#
#   SITE_ADDRESS   your domain (e.g. ctf.example.com) → Caddy gets TLS for you
#   PUBLIC_ORIGIN  the browser-facing origin (e.g. https://ctf.example.com)
#   JWT_SECRET     a long random value (else one is generated + persisted)
#   POSTGRES_PASSWORD / MINIO_ROOT_USER / MINIO_ROOT_PASSWORD  real credentials
#
# See the README "Deploying to production" section and .env.example.
#
# For development (hot reload) use: docker compose -f docker-compose.dev.yml up

name: flagpost

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # ":80" = plain HTTP on the mapped port (local). Set to a domain for HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "443:443"       # used only when SITE_ADDRESS is a domain (auto-HTTPS)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
      # Wait for the backend to pass its healthcheck (migrations applied +
      # serving) so Caddy doesn't route to it during cold start.
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — the origin the browser
        # uses to reach the API (the Caddy front door).
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
    restart: unless-stopped
    expose:
      - "3000"          # internal only; Caddy is the public entrypoint
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    # Apply migrations (creates tables + seeds the built-in roles) before serving.
    # Single process by design (ADR-0005): the WebSocket layer is in-process.
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flagpost}:${POSTGRES_PASSWORD:-flagpost}@postgres:5432/${POSTGRES_DB:-flagpost}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      # Signed download URLs must point at a host the browser can reach (§13.3).
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # Single-origin topology, so the browser-facing origin is the same one
      # CORS uses. OIDC (#58) needs it explicitly: the redirect_uri handed to an
      # identity provider must match what's registered there exactly, and behind
      # Caddy's TLS the backend only sees a plain-HTTP hop.
      PUBLIC_BASE_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # Set JWT_SECRET explicitly in real deployments (and always for multi-host).
      # Left unset, the app derives a strong secret and persists it to the volume
      # below, so sessions survive restarts and container recreation.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_FILE: /data/.jwt_secret
      # The refresh cookie is a 14-day credential, so it ships with Secure set:
      # this stack is the production stack, and Caddy terminates TLS in front of
      # it. Browsers treat http://localhost as a secure context, so a local
      # `docker compose up` is unaffected. Set false only for a plain-HTTP
      # deployment on a non-localhost host, which is not a supported topology.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      # Encryption key for at-rest secrets (ADR-0020) — same derive-and-persist
      # pattern as the JWT secret, on the same volume so it survives recreation.
      # Losing it means stored provider secrets must be re-entered.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      SECRET_ENCRYPTION_KEY_FILE: /data/.secret_key
      # Demo instance (e.g. demo.flagpost.io): seeds public demo accounts + sample
      # data, shows a "resets hourly" banner, and disables outbound actions
      # (webhooks/email). Never enable on a real deployment. Reset the instance by
      # recreating the stack on a schedule (`docker compose down -v && up -d`).
      # `false`, not empty: pydantic rejects "" as a bool, so an unset
      # DEMO_MODE would crash-loop the backend on a fresh `docker compose up`.
      DEMO_MODE: ${DEMO_MODE:-false}
    expose:
      - "8000"          # internal only; reached via Caddy /api and /ws
    volumes:
      - backend-data:/data
    healthcheck:
      # python (stdlib) rather than curl — the slim image has no curl.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s   # allow time for `alembic upgrade head` on first boot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flagpost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flagpost}
      POSTGRES_DB: ${POSTGRES_DB:-flagpost}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flagpost} -d ${POSTGRES_DB:-flagpost}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"     # S3 API — the browser fetches attachments via signed URLs
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
  backend-data:
  caddy-data:
  caddy-config:
