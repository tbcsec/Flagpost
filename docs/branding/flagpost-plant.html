<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flagpost — Plant animation reference</title>

<!-- Canonical animation source -->
<link rel="stylesheet" href="flagpost-plant.css">

<style>
  /* Page chrome only — not part of the brand assets. */
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#101720;font-family:'Space Grotesk',system-ui,sans-serif;
  }
  .lockup{display:flex;align-items:center;gap:12px}
  .wm{font-size:27px;font-weight:700;letter-spacing:-.035em;color:#F0F3F0}
  .wm span{color:#2CB57C}
</style>
</head>
<body>

<!--
  Minimal reference implementation.

  The mark is authored once. The data-animate attribute is the only difference
  between the resting logo and the animated logo, and it is added by script so
  that it can be gated to once per session.

  See LOGO-SPEC.md §11.
-->

<div class="lockup">
  <svg id="fp-mark" class="fp-mark" width="42" height="42" viewBox="0 0 64 64"
       role="img" aria-label="Flagpost">
    <ellipse class="fp-ground" cx="22" cy="55" rx="12" ry="3.2" fill="#E4E7E2"/>
    <rect class="fp-post" x="19" y="6" width="6" height="49" rx="3" fill="#E4E7E2"/>
    <path class="fp-flag" d="M25 9 H46 L40.5 16 L46 23 H25 Z" fill="#2CB57C"/>
  </svg>
  <span class="wm">Flag<span>post</span></span>
</div>

<script>
(function () {
  var SESSION_KEY = 'fp:plant-played';
  var mark = document.getElementById('fp-mark');
  if (!mark) return;

  // sessionStorage throws in some sandboxed and private-mode contexts.
  // A storage failure must never stop the logo rendering.
  var alreadyPlayed = false;
  try {
    alreadyPlayed = sessionStorage.getItem(SESSION_KEY) === '1';
  } catch (e) {
    alreadyPlayed = false;
  }

  if (alreadyPlayed) return;   // resting state — no attribute, no animation

  mark.setAttribute('data-animate', 'plant');

  try {
    sessionStorage.setItem(SESSION_KEY, '1');
  } catch (e) {
    /* non-fatal — it simply plays again next load */
  }
})();
</script>

</body>
</html>
